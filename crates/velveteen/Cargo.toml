[package]
name = "velveteen"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Task vocabulary: ForgeSpec, ForgeCommand, and the TaskPlacement (location x runtime) axis, sharing TaskId + scryer scope"

[lib]
name = "velveteen"
path = "src/lib.rs"

# R619: this crate is the *vocabulary* half — a task is a description of work,
# not a process supervisor. Deps stay at serde + workload-spec + observation so
# a queue, scheduler, dashboard, or wire client can describe a task without
# pulling in tokio/process, the docker shim, task-runs' SQLite store, or
# yah-scryer. Those live in the `velveteen-exec` sibling; add driver deps there.
[dependencies]
observation = { path = "../observation", version = "0.8.42" }
workload-spec = { package = "yah-workload-spec", version = "0.8.42" }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"
