[workspace]
members = [
    "crates/observation",
    "crates/task-runs",
    "crates/velveteen",
    "crates/velveteen-exec",
    "crates/scryer",
    "crates/qed-gha",
    "crates/qed",
    "crates/manifest-bind",
    "crates/pleasehold",
]
resolver = "2"

[workspace.package]
version = "0.8.42"
edition = "2021"
authors = ["yah Dev <human@yah.dev>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yah-ai/qed"

# During development, patch crates.io with the local yah-base crate paths
# (qed depends only on yah-base, not yubaba — the cross-patch loop is broken).
# Stripped on export (scripts/export-oss.sh) and dropped once yah-base is
# published to crates.io.
[workspace.dependencies]
# Turso pin — keep in lockstep with yah root and external/turso-backup (0.7.2).
# default-features off drops turso's bundled mimalloc #[global_allocator];
# the yah binary owns the process-wide allocator (R365-F20).
# Bumped 0.6.1 -> 0.7.2 in R830 (0.6.1 loses writes behind a live Rows).
turso = { version = "0.7.2", default-features = false, features = ["fts"] }
turso_core = { version = "0.7.2", features = [] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1
# W308/R745-T1: `-C incremental` makes sccache refuse a crate outright. This
# glob applies to DEPENDENCIES and never to workspace members, so crates you
# edit here keep incremental and crates you merely consume become cacheable.
incremental = false
